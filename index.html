
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table - Sohail Khan</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:white;padding:16px}
header{text-align:center;padding:20px 0}
h1{color:#65e6b5;margin-bottom:8px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #475569;background:#182337;color:white;font-size:16px}
#table{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.element{background:#173c42;border:1px solid #397e78;border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;min-height:85px}
.element b{display:block;font-size:25px;color:#72f0c3}
.element small{display:block;font-size:11px;margin-top:5px}
#detail{background:#182337;padding:18px;border-radius:12px;margin-top:18px;line-height:1.8}
footer{text-align:center;color:#9ca3af;margin-top:25px;font-size:13px}
@media(min-width:700px){#table{grid-template-columns:repeat(8,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>Periodic Table</h1>
<p>Explore the Elements of Chemistry</p>
</header>
<input id="search" placeholder="Search element, symbol or atomic number..." oninput="render()">
<div id="table"></div>
<div id="detail">Tap any element to see its details.</div>
<footer>Built by Sohail Khan</footer>
<script>
const elements=[
[1,"H","Hydrogen",1.008,"Nonmetal"],
[2,"He","Helium",4.0026,"Noble gas"],
[3,"Li","Lithium",6.94,"Alkali metal"],
[4,"Be","Beryllium",9.0122,"Alkaline earth metal"],
[5,"B","Boron",10.81,"Metalloid"],
[6,"C","Carbon",12.011,"Nonmetal"],
[7,"N","Nitrogen",14.007,"Nonmetal"],
[8,"O","Oxygen",15.999,"Nonmetal"],
[9,"F","Fluorine",18.998,"Halogen"],
[10,"Ne","Neon",20.180,"Noble gas"],
[11,"Na","Sodium",22.990,"Alkali metal"],
[12,"Mg","Magnesium",24.305,"Alkaline earth metal"],
[13,"Al","Aluminium",26.982,"Post-transition metal"],
[14,"Si","Silicon",28.085,"Metalloid"],
[15,"P","Phosphorus",30.974,"Nonmetal"],
[16,"S","Sulfur",32.06,"Nonmetal"],
[17,"Cl","Chlorine",35.45,"Halogen"],
[18,"Ar","Argon",39.948,"Noble gas"],
[19,"K","Potassium",39.098,"Alkali metal"],
[20,"Ca","Calcium",40.078,"Alkaline earth metal"],
[26,"Fe","Iron",55.845,"Transition metal"],
[29,"Cu","Copper",63.546,"Transition metal"],
[30,"Zn","Zinc",65.38,"Transition metal"],
[47,"Ag","Silver",107.868,"Transition metal"],
[79,"Au","Gold",196.967,"Transition metal"],
[80,"Hg","Mercury",200.592,"Transition metal"],
[82,"Pb","Lead",207.2,"Post-transition metal"],
[92,"U","Uranium",238.029,"Actinide"]
];
function render(){
const q=document.getElementById("search").value.toLowerCase();
document.getElementById("table").innerHTML=elements.filter(e=>e.join(" ").toLowerCase().includes(q)).map(e=>
`<div class="element" onclick="showElement(${e[0]})"><small>${e[0]}</small><b>${e[1]}</b><small>${e[2]}</small></div>`
).join("");
}
function showElement(n){
const e=elements.find(x=>x[0]===n);
document.getElementById("detail").innerHTML=
`<h2>${e[2]} (${e[1]})</h2>
Atomic Number: ${e[0]}<br>
Atomic Mass: ${e[3]} u<br>
Element Type: ${e[4]}`;
}
render();
</script>
</body>
</html>
