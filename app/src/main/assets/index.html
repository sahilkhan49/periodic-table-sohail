function mk(e){return `<div class="cell" style="background:${e.c}" data-q="${e.n} ${e.s} ${e.nm}" onclick="show(${e.n})"><div class="num">${e.n}</div><div class="sym">${e.s}</div><div class="name">${e.nm}</div><div class="mass">${e.m}</div></div>`}
function render(){let g=document.getElementById("grid");g.innerHTML="";for(let p=1;p<=7;p++){for(let gg=1;gg<=18;gg++){let f=els.find(x=>x.p===p&&x.g===gg);if(f){g.innerHTML+=mk(f);}else{if((p===6&&gg===3)){g.innerHTML+=`<div class="cell" style="background:#ffb6a0;border:2px dashed #fff"><div class="num">57-71</div><div class="sym">La-Lu</div></div>`;}else if(p===7&&gg===3){g.innerHTML+=`<div class="cell" style="background:#ff99cc;border:2px dashed #fff"><div class="num">89-103</div><div class="sym">Ac-Lr</div></div>`;}else g.innerHTML+=`<div class="empty"></div>`;}}}let b=document.getElementById("bottom");bot.forEach(e=>b.innerHTML+=mk(e));}
function show(n){let all=[...els,...bot];let e=all.find(x=>x.n===n);document.getElementById("detail").innerHTML=`<b>${e.nm} (${e.s})</b> - Atomic Number ${e.n}, Mass ${e.m} u`;document.getElementById("box").innerHTML=`<div style="background:${e.c};padding:10px;border-radius:12px"><div>${e.n}</div><h2 style="margin:0">${e.s}</h2><div>${e.nm}</div><b>${e.m} u</b></div><h3>${e.nm}</h3><div style="text-align:left;font-size:14px;line-height:1.6"><b>Number:</b> ${e.n}<br><b>Symbol:</b> ${e.s}<br><b>Mass:</b> ${e.m} u<br><b>Name:</b> ${e.nm}</div><button onclick="closeM()" style="width:100%;padding:10px;background:#0f172a;color:#fff;border:none;border-radius:8px;margin-top:10px">Close</button>`;document.getElementById("modal").classList.add("show");}
function closeM(){document.getElementById("modal").classList.remove("show");}
document.getElementById("search").addEventListener("input",e=>{let q=e.target.value.toLowerCase();document.querySelectorAll(".cell[data-q]").forEach(c=>{c.style.display=c.getAttribute("data-q").toLowerCase().includes(q)?"flex":"none";});});
document.getElementById("modal").addEventListener("click",ev=>{if(ev.target.id==="modal") closeM();});
render();
</script>
