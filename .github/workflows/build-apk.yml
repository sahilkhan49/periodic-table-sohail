name: Build APK - Sohail Khan
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || chmod +x ./android/gradlew || echo "No gradlew found"
        
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug
          elif [ -f "./android/gradlew" ]; then cd android && ./gradlew assembleDebug
          else echo "gradlew not found!" && ls -R && exit 1
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
