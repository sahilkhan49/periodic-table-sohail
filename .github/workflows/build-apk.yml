name: Build APK - Sohail Khan
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show project structure
        run: |
          pwd
          ls -la
          ls -la app/ || true
          cat settings.gradle || cat settings.gradle.kts || echo "no settings"
          cat build.gradle || cat build.gradle.kts || echo "no root build"

      - name: Make gradlew executable
        run: chmod +x ./gradlew || chmod +x ./android/gradlew || true

      - name: Build with Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          else
            echo "No wrapper, using gradle directly"
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk-Sohail-Khan
          path: "**/*.apk"
          if-no-files-found: warn
